# Il sito Astro si trova nella sottocartella carmine-galluzzi-portfolio/.
# "base" indica a Netlify dove eseguire install e build; "publish" è relativo a base.
# Configurazione Netlify — sito Astro statico (nessun adapter SSR, nessuna funzione serverless).

[build]
  base = "carmine-galluzzi-portfolio"
  command = "npm install --no-audit --no-fund && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ------------------------------------------------------------------
# Intestazioni di sicurezza per tutte le pagine
# ------------------------------------------------------------------
# Content-Security-Policy: tutte le risorse del sito sono servite dallo stesso dominio.
#  - 'unsafe-inline' su script/stili è necessario per: script brevi che Astro può inserire inline,
#    il JSON-LD, gli attributi style usati per i ritardi delle animazioni.
#  - form-action 'self': il modulo invia solo a Netlify Forms sullo stesso dominio.
#  - Nessuno script, font o servizio esterno è consentito.
# Se in futuro aggiungi servizi esterni (es. mappe, video), aggiorna questa policy.
# Nota: nelle Deploy Preview la barra "Netlify Drawer" (script di app.netlify.com) viene bloccata;
# non influisce sul sito pubblicato.
#
# HSTS non è impostato qui: Netlify lo invia già automaticamente sui domini con HTTPS gestito.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Asset generati da Astro (nome con hash): cache lunga e immutabile
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Font self-hosted: cache di 30 giorni
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Favicon e immagine social: cache di una settimana
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Pagina di conferma invio modulo: mai indicizzata
[[headers]]
  for = "/messaggio-inviato/"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/messaggio-inviato/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
